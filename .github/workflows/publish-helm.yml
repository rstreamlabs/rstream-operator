name: Build release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DOCKER_PLATFORMS: linux/386,linux/amd64,linux/amd64/v2,linux/ppc64le,linux/arm/v7,linux/arm/v6,linux/arm64

jobs:
  build:
    name: Build chart and image candidate
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        shell: bash
        env:
          HELM_SHA256: 15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0
          HELM_VERSION: 3.21.3
        run: |
          set -euo pipefail
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --output "$archive" "https://get.helm.sh/${archive}"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive"
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build release candidate
        shell: bash
        run: |
          set -euo pipefail
          chart_version=$(helm show chart charts/rstream-operator | awk '$1 == "version:" { print $2 }')
          app_version=$(helm show chart charts/rstream-operator | awk '$1 == "appVersion:" { print $2 }')
          if [[ "$VERSION" == "$chart_version" && "$VERSION" == "$app_version" ]]; then
            :
          else
            echo "tag ${VERSION}, chart ${chart_version}, and app ${app_version} versions must match" >&2
            exit 1
          fi
          candidate_directory="${PWD}/out/release-candidate/${VERSION}"
          mkdir -p "$candidate_directory"
          helm lint charts/rstream-operator
          helm package charts/rstream-operator --destination "$candidate_directory"
          docker buildx build \
            --platform "$RELEASE_DOCKER_PLATFORMS" \
            --tag "docker.io/rstream/rstream-operator:${VERSION}" \
            --output "type=oci,dest=${candidate_directory}/rstream-operator-${VERSION}.oci.tar" \
            .
          archive="release-candidate-${VERSION}.tar.gz"
          ./.github/scripts/create-release-candidate.sh "$VERSION" "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ env.VERSION }}
          path: |
            release-candidate-${{ env.VERSION }}.tar.gz
            release-candidate-${{ env.VERSION }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
