name: Promote stable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed candidate tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish approved chart and image
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    environment: stable-release
    runs-on: ubuntu-latest
    steps:
      - name: Find matching release candidate
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')" != true ]]; then
            echo "GitHub release ${RELEASE_TAG} must still be a draft" >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [[ -n "$latest_tag" && "$(printf '%s\n' "${latest_tag#v}" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "refusing to promote ${RELEASE_TAG} after newer release ${latest_tag}" >&2
            exit 1
          fi
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          tag_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          if [[ "$(jq -r '.object.type' <<<"$tag_ref")" == tag ]]; then
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')
          fi
          candidate_run=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-helm.yml/runs" \
            -f branch="$RELEASE_TAG" -f event=push -f status=success -f per_page=20 \
            --jq ".workflow_runs | map(select(.head_sha == \"${tag_sha}\")) | first | .id")
          if [[ -z "$candidate_run" || "$candidate_run" == null ]]; then
            echo "no successful release candidate run matches ${RELEASE_TAG}" >&2
            exit 1
          fi
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${version}"
            echo "run_id=${candidate_run}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ steps.release.outputs.version }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Restore release candidate
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./.github/scripts/restore-release-candidate.sh
          "$VERSION" "candidate/release-candidate-${VERSION}.tar.gz"
      - name: Install publishing clients
        shell: bash
        env:
          HELM_SHA256: 61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14
          HELM_VERSION: 3.21.4
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --output "$archive" "https://get.helm.sh/${archive}"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive"
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: rstream
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and verify operator image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./.github/scripts/publish-docker-image.sh
          "out/release-candidate/${VERSION}/rstream-operator-${VERSION}.oci.tar"
          docker.io/rstream/rstream-operator "$VERSION"
      - name: Publish and verify Helm chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./.github/scripts/publish-helm-chart.sh
          "out/release-candidate/${VERSION}/rstream-operator-${VERSION}.tgz"
          oci://ghcr.io/rstreamlabs "$VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')" != false ]]; then
            echo "GitHub release is still a draft: ${RELEASE_TAG}" >&2
            exit 1
          fi
